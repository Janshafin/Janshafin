name: Activity skyline

on:
  push:
    branches: [main]
    paths:
      - "studio/scenes/activity.js"
      - "studio/scenes/common.js"
      - "studio/render.mjs"
      - ".github/workflows/activity-skyline.yml"
  schedule:
    - cron: "21 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activity-skyline
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install the studio
        working-directory: studio
        run: npm ci

      - name: Render the skyline from the public contribution calendar
        working-directory: studio
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node render.mjs activity

      - name: Commit the refreshed skyline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.webp
          if ! git diff --cached --quiet; then
            git commit -m "activity: redraw skyline"
            git push
          fi
