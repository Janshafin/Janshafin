name: Editorial contribution runway

on:
  push:
    branches: [main]
    paths:
      - "scripts/render_contributions.py"
      - ".github/workflows/editorial-contributions.yml"
  schedule:
    - cron: "21 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editorial-contribution-art
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the profile
        uses: actions/checkout@v4

      - name: Render actual GitHub contribution activity
        run: python3 scripts/render_contributions.py

      - name: Commit the refreshed artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-runway.svg
          if ! git diff --cached --quiet; then
            git commit -m "art: refresh the contribution runway"
            git push
          fi
