name: Appendix A — activity figure

on:
  push:
    branches: [main]
    paths:
      - "scripts/render_contributions.py"
      - "scripts/typeset.py"
      - ".github/workflows/editorial-contributions.yml"
  schedule:
    - cron: "21 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: appendix-a
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the profile
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the typesetter
        run: pip install -r scripts/requirements.txt

      - name: Redraw Appendix A from the public contribution calendar
        run: python scripts/render_contributions.py

      - name: Commit the refreshed figure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/appendix-a-light.svg assets/appendix-a-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "appendix: redraw activity figure"
            git push
          fi
