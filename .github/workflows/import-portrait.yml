name: Import supplied editorial portrait
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-portrait.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import portrait to repository
        env:
          PORTRAIT_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fb8b2b89b-124e-4e20-a03b-476ae3c5e9f1/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAHiaVDy6M9eRv-b57CwnKJRL2ZTIF0JXT6ph7bvXQGFP&exp=1793186404&osig=AAAAAAAAAAAAAAAAAAAAANLUHXQKs18dwhOAYUdXrtVDI0doOORJMhriQXGnguxn&signer=media-rpc&token=AAIAAU0AJGI4YjJiODliLTEyNGUtNGUyMC1hMDNiLTQ3NmFlM2M1ZTlmMQAAAAABoYI9FqBkyYsdUsTmZSDk3ZUZ11G4FUsQUehEvfL_l_8ouu-Vvg&x-canva-quality=thumbnail'
        run: |
          curl --fail --location --retry 3 --max-time 40 --silent --show-error "$PORTRAIT_URL" -o assets/onchain-portrait.png
          file assets/onchain-portrait.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/onchain-portrait.png
          git diff --cached --quiet || (git commit -m "art: add supplied cyberpunk portrait" && git push)
