name: Proof of work

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/proof-of-work.yml"
  schedule:
    - cron: "21 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: proof-of-work
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the profile
        uses: actions/checkout@v4

      - name: Redraw from the public contribution calendar
        run: python3 scripts/render_contributions.py

      - name: Commit the redrawn graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/proof-of-work.svg
          if ! git diff --cached --quiet; then
            git commit -m "art: redraw proof of work"
            git push
          fi
