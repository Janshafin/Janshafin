<svg xmlns="http://www.w3.org/2000/svg" width="600" height="650" viewBox="0 0 600 650" role="img" aria-label="Animated Ethereum crystal with interconnected blockchain cubes, orbiting transaction nodes and confirmation pulses">
<defs>
 <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#141331"/><stop offset=".55" stop-color="#211950"/><stop offset="1" stop-color="#111E49"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#765CFF" stop-opacity=".74"/><stop offset=".5" stop-color="#5641C8" stop-opacity=".21"/><stop offset="1" stop-color="#32285B" stop-opacity="0"/></radialGradient>
 <linearGradient id="faceA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E4ECFF"/><stop offset=".55" stop-color="#9DADFF"/><stop offset="1" stop-color="#7459EB"/></linearGradient>
 <linearGradient id="faceB" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#809EFF"/><stop offset="1" stop-color="#2D3DE5"/></linearGradient>
 <linearGradient id="faceC" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ABB4FF"/><stop offset="1" stop-color="#5D3AD5"/></linearGradient>
 <linearGradient id="faceD" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5A6CEE"/><stop offset="1" stop-color="#9868E8"/></linearGradient>
 <linearGradient id="ray" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F8916B"/><stop offset=".54" stop-color="#E8F86B"/><stop offset="1" stop-color="#A593FD"/></linearGradient>
 <pattern id="microgrid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#A8A1EB" stroke-opacity=".09" stroke-width=".75"/><circle cx="0" cy="0" r=".9" fill="#B7AFFF" opacity=".3"/></pattern>
 <clipPath id="border"><rect x="17" y="17" width="566" height="616" rx="0"/></clipPath>
 <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="11"/></filter>
 <style>
 @keyframes levitate{0%,100%{transform:translateY(0)}50%{transform:translateY(-13px)}}
 @keyframes hoverL{0%,100%{transform:translate(0,0)}50%{transform:translate(-7px,-11px)}}
 @keyframes hoverR{0%,100%{transform:translate(0,0)}50%{transform:translate(8px,9px)}}
 @keyframes orbit{to{transform:rotate(360deg)}}
 @keyframes orbitBack{to{transform:rotate(-360deg)}}
 @keyframes flow{to{stroke-dashoffset:-140}}
 @keyframes twinkle{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.3)}}
 @keyframes breathe{0%,100%{opacity:.48}50%{opacity:.92}}
 @keyframes drop{0%,100%{transform:translateY(0);opacity:1}45%{transform:translateY(-5px);opacity:.55}}
 @keyframes scan{0%{transform:translateX(-155px)}100%{transform:translateX(410px)}}
 @keyframes status{0%,100%{opacity:.4}50%{opacity:1}}
 .eth{animation:levitate 7s ease-in-out infinite}.blockL{animation:hoverL 6.5s ease-in-out infinite}.blockR{animation:hoverR 5.8s ease-in-out infinite}.blockT{animation:hoverL 8.3s ease-in-out infinite reverse}
 .ring{transform-origin:300px 304px;animation:orbit 34s linear infinite}.ring2{transform-origin:300px 304px;animation:orbitBack 43s linear infinite}
 .moving{stroke-dasharray:7 15;animation:flow 7.8s linear infinite}
 .star{animation:twinkle 4.3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
 .aura{animation:breathe 5.5s ease-in-out infinite}
 .pulse{animation:status 2.1s ease-in-out infinite}
 .tick{animation:drop 5.4s ease-in-out infinite}
 .scanner{animation:scan 9s linear infinite}
 @media(prefers-reduced-motion:reduce){*{animation:none!important}}
 </style>
</defs>
<rect width="600" height="650" fill="url(#night)"/>
<rect x="18" y="18" width="564" height="614" fill="url(#microgrid)"/>
<rect x="18" y="18" width="564" height="614" fill="none" stroke="#AF9BFF" stroke-opacity=".68" stroke-width="2"/>
<path d="M36 83H564M36 536H564" stroke="#ACA7ED" stroke-opacity=".46"/>
<rect x="35" y="33" width="145" height="34" rx="17" fill="#DBFB67"/>
<text x="107" y="55" font-family="Arial,sans-serif" font-size="14" font-weight="900" fill="#171A30" text-anchor="middle" letter-spacing="1.4">ETHEREUM / 01</text>
<text x="552" y="55" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#D5CFFF" text-anchor="end" letter-spacing="1">ONCHAIN STUDIO</text>
<g clip-path="url(#border)">
<circle cx="49" cy="129" r="2" fill="#DFFB65" opacity=".65" class="star" style="animation-delay:0.00s"/><circle cx="124" cy="175" r="2" fill="#B99BFF" opacity=".65" class="star" style="animation-delay:0.23s"/><circle cx="518" cy="113" r="3" fill="#F9A75F" opacity=".65" class="star" style="animation-delay:0.46s"/><circle cx="551" cy="192" r="2" fill="#DFFB65" opacity=".65" class="star" style="animation-delay:0.69s"/><circle cx="74" cy="377" r="3" fill="#B99BFF" opacity=".65" class="star" style="animation-delay:0.92s"/><circle cx="528" cy="482" r="2" fill="#F9A75F" opacity=".65" class="star" style="animation-delay:1.15s"/><circle cx="127" cy="466" r="2" fill="#DFFB65" opacity=".65" class="star" style="animation-delay:1.38s"/><circle cx="89" cy="549" r="2" fill="#B99BFF" opacity=".65" class="star" style="animation-delay:1.61s"/><circle cx="506" cy="536" r="3" fill="#F9A75F" opacity=".65" class="star" style="animation-delay:1.84s"/><circle cx="448" cy="80" r="1" fill="#DFFB65" opacity=".65" class="star" style="animation-delay:2.07s"/><circle cx="179" cy="114" r="1" fill="#B99BFF" opacity=".65" class="star" style="animation-delay:2.30s"/><circle cx="459" cy="169" r="1" fill="#F9A75F" opacity=".65" class="star" style="animation-delay:2.53s"/><circle cx="50" cy="442" r="1" fill="#DFFB65" opacity=".65" class="star" style="animation-delay:2.76s"/><circle cx="559" cy="345" r="1" fill="#B99BFF" opacity=".65" class="star" style="animation-delay:2.99s"/><circle cx="480" cy="571" r="1" fill="#F9A75F" opacity=".65" class="star" style="animation-delay:3.22s"/><circle cx="145" cy="94" r="2" fill="#DFFB65" opacity=".65" class="star" style="animation-delay:3.45s"/><circle cx="423" cy="549" r="2" fill="#B99BFF" opacity=".65" class="star" style="animation-delay:3.68s"/>
<circle class="aura" cx="300" cy="302" r="233" fill="url(#aura)"/>
<!-- orbital tracking systems -->
<ellipse cx="300" cy="303" rx="209" ry="168" stroke="#777AE9" stroke-opacity=".37" stroke-width="1.5" fill="none" transform="rotate(-28 300 303)"/>
<ellipse cx="300" cy="303" rx="206" ry="158" stroke="#FF9C6F" stroke-opacity=".46" stroke-width="1.5" fill="none" transform="rotate(42 300 303)"/>
<circle class="ring" cx="300" cy="304" r="185" fill="none" stroke="#A5ABFF" stroke-width="1.7" stroke-dasharray="3 22" opacity=".58"/>
<circle class="ring2" cx="300" cy="304" r="219" fill="none" stroke="#B9F668" stroke-width="1.7" stroke-dasharray="2 36" opacity=".53"/>
<path class="moving" d="M86 326C114 216 176 128 300 126C425 125 487 206 519 316" stroke="url(#ray)" stroke-width="3.5" fill="none" opacity=".86" stroke-linecap="round"/>
<path class="moving" d="M89 363C145 478 201 497 309 496C428 496 485 428 512 361" stroke="#9CBAFF" stroke-width="3" fill="none" opacity=".7"/>
<!-- block connectors: three independent nodes tethered to the main Ethereum system -->
<g fill="none" stroke="#E8FA70" stroke-opacity=".65" stroke-width="2">
<path d="M125 247L200 270L245 247" stroke-dasharray="5 9" class="moving"/>
<path d="M404 370L473 386L505 346" stroke-dasharray="5 9" class="moving"/>
<path d="M300 164L380 133L431 162" stroke-dasharray="5 9" class="moving"/>
</g>
<!-- luminous backdrop -->
<ellipse cx="300" cy="319" rx="111" ry="150" fill="#8F7FFF" opacity=".32" filter="url(#softGlow)"/>
<!-- Ethereum crystal logo -->
<g class="eth">
 <g opacity=".31" filter="url(#softGlow)"><path d="M300 154L194 320L300 382L406 320Z" fill="#A2A3FF"/></g>
 <path d="M300 135L196 308L300 366Z" fill="url(#faceA)"/>
 <path d="M300 135L404 308L300 366Z" fill="url(#faceB)"/>
 <path d="M196 308L300 366L300 241Z" fill="#B9C9FF" opacity=".5"/>
 <path d="M404 308L300 366L300 241Z" fill="#4859EB" opacity=".55"/>
 <path d="M300 388L196 329L300 472Z" fill="url(#faceC)"/>
 <path d="M300 388L404 329L300 472Z" fill="url(#faceD)"/>
 <path d="M300 135L196 308L300 366L404 308Z" stroke="#D7D7FF" stroke-opacity=".88" fill="none" stroke-width="2.3"/>
 <path d="M196 329L300 472L404 329L300 388Z" stroke="#9AA7FF" stroke-opacity=".81" fill="none" stroke-width="2.3"/>
 <path d="M300 135V366M300 388V472" stroke="#B1B6FF" stroke-opacity=".68" stroke-width="1.5"/>
 <path d="M232 306L300 169" stroke="#FFFFFF" opacity=".62" stroke-width="5" stroke-linecap="round"/>
</g>
<!-- linked cube 1 -->
<g class="blockL">
 <path d="M87 206L121 188L156 206L121 225Z" fill="#EBFF9D" stroke="#17162C" stroke-width="2.6"/>
 <path d="M87 206V244L121 263V225Z" fill="#ACDF5D" stroke="#17162C" stroke-width="2.6"/>
 <path d="M121 225L156 206V244L121 263Z" fill="#68A755" stroke="#17162C" stroke-width="2.6"/>
 <path d="M121 225V263" stroke="#E2F98B" stroke-width="1.6"/>
</g>
<!-- linked cube 2 -->
<g class="blockR">
 <path d="M447 352L481 331L516 352L481 372Z" fill="#FFB2AD" stroke="#17162C" stroke-width="2.6"/>
 <path d="M447 352V390L481 411V372Z" fill="#F17A94" stroke="#17162C" stroke-width="2.6"/>
 <path d="M481 372L516 352V390L481 411Z" fill="#AE54B7" stroke="#17162C" stroke-width="2.6"/>
 <path d="M481 372V411" stroke="#FFD0D5" stroke-width="1.6"/>
</g>
<!-- linked cube 3 -->
<g class="blockT">
 <path d="M404 135L431 118L458 135L431 150Z" fill="#BFD0FF" stroke="#17162C" stroke-width="2.5"/>
 <path d="M404 135V166L431 182V150Z" fill="#729CFF" stroke="#17162C" stroke-width="2.5"/>
 <path d="M431 150L458 135V166L431 182Z" fill="#5C5CEB" stroke="#17162C" stroke-width="2.5"/>
</g>
<!-- independent transaction waypoints -->
<g><circle cx="118" cy="356" r="18" stroke="#E8F96A" stroke-opacity=".75" stroke-width="1.5" fill="#1A1D4A"/><circle class="pulse" cx="118" cy="356" r="6" fill="#E7F66B"/></g>
<g><circle cx="495" cy="230" r="16" stroke="#A8A7FF" stroke-opacity=".8" stroke-width="1.5" fill="#1A1D4A"/><circle class="pulse" cx="495" cy="230" r="5.5" fill="#F78EA6"/></g>
<g><path d="M72 408L96 408M84 396L84 420" stroke="#E8F96A" stroke-width="3" stroke-linecap="round"/></g>
<g><path d="M504 138L524 138M514 128L514 148" stroke="#FB96A9" stroke-width="2.3" stroke-linecap="round"/></g>
<!-- scanner on the lower edge -->
<g><rect x="38" y="461" width="524" height="1.5" fill="#8C8FD0" opacity=".35"/><path class="scanner" d="M39 461h140" stroke="url(#ray)" stroke-width="3.5" stroke-linecap="round"/></g>
<rect x="37" y="471" width="165" height="38" rx="7" fill="#20275A" stroke="#9391D9" stroke-opacity=".5"/>
<circle cx="54" cy="490" r="5.5" class="pulse" fill="#DFFC6E"/>
<text x="68" y="495" font-family="Arial,sans-serif" font-size="12" font-weight="900" letter-spacing="1" fill="#E9EBFF">TX / VERIFIED</text>
<rect x="397" y="471" width="165" height="38" rx="7" fill="#20275A" stroke="#9391D9" stroke-opacity=".5"/>
<circle cx="413" cy="490" r="5.5" class="pulse" fill="#FD91B0"/>
<text x="427" y="495" font-family="Arial,sans-serif" font-size="11.5" font-weight="900" letter-spacing=".6" fill="#E9EBFF">BLOCK / LINKED</text>
</g>
<text x="38" y="566" font-family="Arial,sans-serif" font-size="21" font-weight="900" fill="#F2EFFF" letter-spacing="2.5">A DECENTRALIZED CANVAS.</text>
<text x="38" y="592" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#D9F769" letter-spacing="1.5">ETHEREUM  /  BLOCKS  /  MOVING VALUE</text>
<path d="M39 606H562" stroke="#A5A0E1" stroke-opacity=".4" stroke-width="1.2"/>
<text x="38" y="622" font-family="Arial,sans-serif" font-size="10.5" font-weight="800" fill="#A6AAD9" letter-spacing="1.2">ANIMATED STUDY 001</text>
<text x="562" y="622" text-anchor="end" font-family="Arial,sans-serif" font-size="10.5" font-weight="800" fill="#A6AAD9" letter-spacing="1.2">ONCHAIN  /  OFF SCRIPT</text>
</svg>