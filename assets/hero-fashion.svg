<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="Jan Shafin: onchain, off script — an animated fashion editorial cover">
<defs>
<clipPath id="frame"><rect width="1200" height="650" rx="9"/></clipPath>
<pattern id="grain" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".6" fill="#1D1B25" opacity=".14"/></pattern>
<style>
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes swivel{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes roll{to{transform:rotate(360deg)}} 
@keyframes slide{0%{transform:translateX(-55px);opacity:0}18%,100%{transform:translateX(0);opacity:1}}
@keyframes blink{0%,88%,100%{opacity:1}91%,97%{opacity:.1}}
@keyframes dash{to{stroke-dashoffset:-95}}
.coat{animation:float 6.3s ease-in-out infinite}.star{transform-origin:1009px 120px;animation:roll 19s linear infinite}.badge{transform-origin:1073px 512px;animation:swivel 5s ease-in-out infinite}.name{animation:slide 1.9s ease-out both}.line{stroke-dasharray:14 16;animation:dash 5s linear infinite}.flash{animation:blink 6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
<g clip-path="url(#frame)">
<rect width="1200" height="650" fill="#F9F2E7"/>
<rect width="1200" height="650" fill="url(#grain)"/>
<rect x="23" y="22" width="1154" height="606" fill="none" stroke="#221F29" stroke-width="2"/>
<rect x="36" y="35" width="1128" height="37" fill="#231E2D"/>
<text x="52" y="59" fill="#F8F2E7" font-family="Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="2.5">J/S  —  INDEPENDENT INTERNET STUDIO</text>
<text x="902" y="59" fill="#D9F34A" font-family="Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="2">ISSUE 001 / 2026</text>
<line x1="55" y1="113" x2="1144" y2="113" stroke="#221F29" stroke-width="2"/>
<text x="56" y="103" fill="#F44877" font-family="Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="3">ENGINEER BY PRACTICE. EDITOR BY INSTINCT.</text>
<g class="name">
<text x="47" y="255" fill="#221F29" font-family="Arial,sans-serif" font-size="164" font-weight="900" letter-spacing="-13">JAN.</text>
<text x="42" y="390" fill="#221F29" font-family="Arial,sans-serif" font-size="150" font-weight="900" letter-spacing="-13">SHAFIN</text>
</g>
