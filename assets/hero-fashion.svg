<text x="58" y="468" fill="#3D3CDE" font-family="Georgia,serif" font-size="47" font-style="italic">Onchain, off script.</text>
<text x="59" y="513" fill="#221F29" font-family="Arial,sans-serif" font-size="21" font-weight="600">Blockchain systems, autonomous agents</text>
<text x="59" y="541" fill="#221F29" font-family="Arial,sans-serif" font-size="21" font-weight="600">&amp; digital experiences with a point of view.</text>
