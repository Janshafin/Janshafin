<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-label="Manifesto: code is infrastructure, presentation is storytelling"><defs><style>@keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}@keyframes spin{to{transform:rotate(360deg)}}.orb{animation:rise 7s ease-in-out infinite}.ring{transform-origin:990px 144px;animation:spin 19s linear infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="1200" height="310" fill="#F44877"/><rect x="18" y="18" width="1164" height="274" fill="none" stroke="#221F29" stroke-width="2"/><text x="46" y="58" fill="#221F29" font-family="Arial,sans-serif" font-size="16" font-weight="900" letter-spacing="2">THE PERSONAL MANIFESTO  /  NOTE FROM THE STUDIO</text><text x="46" y="125" fill="#221F29" font-family="Georgia,serif" font-style="italic" font-size="58">Useful enough to ship.</text><text x="46" y="189" fill="#F9F2E7" font-family="Georgia,serif" font-style="italic" font-size="58">Interesting enough to remember.</text><text x="48" y="249" fill="#221F29" font-family="Arial,sans-serif" font-size="21" font-weight="700">I care about what happens behind the interface — and how it feels in front of it.</text><g class="orb"><circle cx="996" cy="141" r="95" fill="#D9F34A" stroke="#221F29" stroke-width="3"/><g class="ring"><circle cx="996" cy="141" r="60" fill="none" stroke="#3D3CDE" stroke-width="3" stroke-dasharray="13 17"/></g><path d="M968 107L1031 174M1034 111L967 171" stroke="#221F29" stroke-width="15" stroke-linecap="round"/></g></svg>